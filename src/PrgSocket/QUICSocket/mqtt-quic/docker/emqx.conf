# EMQX Enterprise 6.3.2. QUIC listener options follow the example shipped
# in this exact image: etc/examples/listeners.quic.conf.example.
node {
  name = "emqx@127.0.0.1"
  cookie = "mqtt-quic-testbed-local-only"
  data_dir = "/opt/emqx/data"
}
cluster {
  name = mqtt_quic_testbed
  discovery_strategy = manual
}
listeners {
  tcp.default.enable = false
  ssl.default.enable = false
  ws.default.enable = false
  wss.default.enable = false
  quic.default {
    enabled = true
    bind = "0.0.0.0:14567"
    max_connections = 16
    acceptors = 2
    ciphers = "TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256"
    ssl_options {
      cacertfile = "/opt/emqx/etc/lab-certs/ca.pem"
      certfile = "/opt/emqx/etc/lab-certs/broker.pem"
      keyfile = "/opt/emqx/etc/lab-certs/broker.key"
      # One-way TLS: the clients verify the broker using ca.pem + broker.test.
      # The broker does not require client certificates for this local lab.
      verify = verify_none
    }
  }
}
dashboard.listeners.http.bind = "0.0.0.0:18083"
