name: mqtt-quic-testbed
services:
  emqx:
    image: emqx/emqx-enterprise:6.3.2
    container_name: emqx-quic
    hostname: emqx-quic
    restart: unless-stopped
    environment:
      # The image entrypoint otherwise overwrites node.name with the container IP.
      EMQX_NODE__NAME: emqx@127.0.0.1
    ports:
      - "0.0.0.0:14567:14567/udp"
      - "127.0.0.1:18083:18083/tcp"
    volumes:
      - ./emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./certs/ca.pem:/opt/emqx/etc/lab-certs/ca.pem:ro
      - ./certs/broker.pem:/opt/emqx/etc/lab-certs/broker.pem:ro
      - ./certs/broker.key:/opt/emqx/etc/lab-certs/broker.key:ro
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - broker
volumes:
  emqx-data:
  emqx-log:
networks:
  broker:
    driver: bridge
